<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusTrack | Student Attendance</title>
  <link rel="stylesheet" href="/frontend/style.css">
</head>
<body>

  <!-- AUTHENTICATION: STUDENT PORTAL -->
  <div id="auth-container" class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-icon">🎓</div>
      <h2>CampusTrack</h2>
      <p class="auth-subtitle">Your personal semester dashboard</p>
      
      <!-- Changed from div to form with an onsubmit handler -->
      <form class="auth-form" onsubmit="submitAuth(); return false;">
        <input type="text" id="auth-username" placeholder="Student Username" autocomplete="username" required>
        <input type="text" id="auth-pin" placeholder="4-Digit PIN" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="one-time-code" style="-webkit-text-security: disc;" required>
        
        <div id="target-pct-container" style="display: none; margin-bottom: 12px; text-align: left;">
          <label style="font-size: 0.8rem; color: var(--text-muted); display: block; margin-bottom: 4px;">Target Attendance Requirement (%):</label>
          <input type="number" id="auth-target" placeholder="Target % (e.g. 75, 80, 85)" min="10" max="100" value="80">
        </div>

        <div class="auth-actions">
          <!-- Changed button type to submit and removed the onclick -->
          <button type="submit" id="btn-main-auth" class="btn-primary">Log In</button>
        </div>
        
        <div class="auth-toggle">
          <span id="auth-toggle-text">New here? <a href="#" onclick="toggleAuthMode(); return false;">Create an account</a></span>
        </div>
      </form>
    </div>
  </div>

  <!-- MAIN APPLICATION: DASHBOARD -->
  <div id="app-container" style="display: none;">
    
    <!-- Top Navigation -->
    <nav class="top-nav">
      <div class="nav-left">
        <span class="logo-icon">🎓</span>
        <h1>CampusTrack</h1>
        <span class="target-badge" id="nav-target-badge">🎯 80%</span>
      </div>
      <div class="nav-right">
        <span class="greeting" id="user-greeting"></span>
        <button onclick="logout()" class="btn-logout">Log Out</button>
      </div>
    </nav>

    <main class="dashboard-layout">
      
      <!-- Primary Content (Today's Classes & Overview) -->
      <div class="main-dashboard">

        <section class="dashboard-section">
          <h2>📌 Today's Schedule</h2>
          <div id="today-classes-list" class="card-grid">
            <div class="loading-skeleton"></div>
          </div>
        </section>

        <section class="dashboard-section">
          <h2>📊 Attendance Overview</h2>
          <div id="subject-cards-list" class="card-grid">
            <div class="loading-skeleton"></div>
          </div>
        </section>

        <section class="dashboard-section">
          <h2>📝 Edit Past Attendance</h2>
          <div class="history-controls">
            <select id="history-subject-id" onchange="loadHistory()" class="subject-dropdown">
              <option value="">-- Choose a Subject to Edit --</option>
            </select>
          </div>
          <div id="history-list" class="history-list-container">
             <!-- Remains empty until a subject is selected -->
          </div>
        </section>

      </div>

      <!-- Collapsible Setup Panel (Sidebar on Desktop, Bottom Accordion on Mobile) -->
      <aside class="setup-sidebar">
        <details class="sidebar-collapsible" open>
          <summary class="sidebar-header">
            <h2>⚙️ Semester Setup & Tools</h2>
          </summary>
          
          <div class="sidebar-scroll">
            
            <section class="setup-block">
              <label>📚 1. Add Subjects</label>
              <form id="add-subject-form">
                <input type="text" id="subject-name" placeholder="Subject Name (e.g. Network Theory)" required>
                <button type="submit" class="btn-primary">Save Subject</button>
              </form>
            </section>

            <section class="setup-block">
              <label>🌴 2. Vacations & Exams</label>
              <form id="add-holiday-form">
                <div class="input-row">
                  <div class="date-field">
                    <span class="field-tag">From</span>
                    <input type="date" id="holiday-start" required title="Start Date">
                  </div>
                  <div class="date-field">
                    <span class="field-tag">To</span>
                    <input type="date" id="holiday-end" title="End Date">
                  </div>
                </div>
                <input type="text" id="holiday-desc" placeholder="Reason (e.g. Diwali Break)">
                <button type="submit" class="btn-primary">Add Dates</button>
              </form>
            </section>

            <section class="setup-block">
              <label>📅 3. Weekly Timetable</label>
              <form id="add-schedule-form">
                <select id="sched-subject-id" class="subject-dropdown" required>
                  <option value="">-- Select Subject --</option>
                </select>
                <div class="input-row">
                  <select id="sched-day" required>
                   <option value="0">Monday</option>
                   <option value="1">Tuesday</option>
                   <option value="2">Wednesday</option>
                   <option value="3">Thursday</option>
                   <option value="4">Friday</option>
                   <option value="5">Saturday</option>
                   <option value="6">Sunday</option>
                  </select>
                  <input type="number" id="sched-count" min="1" max="10" value="1" required title="Classes per day">
                </div>
                <button type="submit" class="btn-primary">Add to Timetable</button>
              </form>
            </section>

            <section class="setup-block">
              <label>🚀 4. Generate Classes</label>
              <form id="generate-semester-form">
                <div class="input-row">
                  <div class="date-field">
                    <span class="field-tag">Start</span>
                    <input type="date" id="start-date" required title="Semester Start">
                  </div>
                  <div class="date-field">
                    <span class="field-tag">End</span>
                    <input type="date" id="end-date" required title="Semester End">
                  </div>
                </div>
                <button type="submit" class="btn-primary">Generate Semester</button>
              </form>
            </section>

            <section class="setup-block">
              <label>➕ 5. Add Extra Class</label>
              <form id="add-extra-class-form">
                <select id="extra-subject-id" class="subject-dropdown" required>
                  <option value="">-- Select Subject --</option>
                </select>
                <div class="input-row">
                  <input type="date" id="extra-class-date" required title="Date">
                  <select id="extra-class-status">
                    <option value="PENDING">Pending</option>
                    <option value="PRESENT">Present</option>
                    <option value="ABSENT">Absent</option>
                  </select>
                </div>
                <button type="submit" class="btn-success">Add Extra Class</button>
              </form>
            </section>

            <section class="setup-block danger-zone">
              <label>⚠️ Danger Zone</label>
              <div style="display: flex; flex-direction: column; gap: 10px;">
                <button type="button" id="btn-reset-db" class="btn-danger">Start Fresh (Wipe Data)</button>
                <button type="button" id="btn-delete-account" class="btn-danger" style="background: transparent; border-style: dashed;">Delete Account</button>
              </div>
            </section>

          </div>
        </details>
      </aside>

    </main>
  </div>

<!-- Global Toast Notifications -->
  <div id="toast-container" class="toast-stack"></div>

  <script src="/frontend/script.js"></script>
</body>
</html>
