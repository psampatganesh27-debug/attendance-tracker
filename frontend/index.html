<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tracker | Terminal Environment</title>
  <link rel="stylesheet" href="/frontend/style.css">
</head>
<body>

  <!-- AUTHENTICATION ENVIRONMENT -->
  <div id="auth-container" class="auth-wrapper">
    <div class="terminal-window">
      <div class="terminal-header">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
        <span class="term-title">auth_module.sh</span>
      </div>
      <div class="terminal-body">
        <h2>System Login</h2>
        <input type="text" id="auth-username" placeholder="username" required>
        <input type="password" id="auth-password" placeholder="password" required>
        <div class="auth-actions">
          <button onclick="handleAuth('login')" class="btn-primary">Execute</button>
          <button onclick="handleAuth('register')" class="btn-secondary">Initialize User</button>
        </div>
      </div>
    </div>
  </div>

  <!-- MAIN APPLICATION WORKSPACE -->
  <div id="app-container" class="hidden">
    
    <!-- Top Navigation -->
    <nav class="top-nav">
      <div class="nav-left">
        <h1>Tracker.exe</h1>
        <span class="target-badge">Target Limit: >=80%</span>
      </div>
      <div class="nav-right">
        <span id="user-greeting" class="user-id"></span>
        <button onclick="logout()" class="btn-danger-outline">Terminate Session</button>
      </div>
    </nav>

    <div id="toast-container" class="toast-stack"></div>

    <!-- IDE-Style Layout (Sidebar + Main Content) -->
    <main class="dashboard-grid">
      
      <!-- Left Sidebar: Configuration & Forms -->
      <aside class="config-panel">
        <div class="panel-header">
          <h2>Configuration</h2>
        </div>
        <div class="panel-scroll">
          
          <section class="form-group">
            <label>1. Initialize Subject</label>
            <form id="add-subject-form">
              <input type="text" id="subject-name" placeholder="Subject Name (e.g. DSD)" required>
              <button type="submit" class="btn-primary">Inject</button>
            </form>
          </section>

          <section class="form-group">
            <label>2. Define Blackout Dates</label>
            <form id="add-holiday-form">
              <div class="date-row">
                <input type="date" id="holiday-start" required title="Start Date">
                <input type="date" id="holiday-end" title="End Date">
              </div>
              <input type="text" id="holiday-desc" placeholder="Reason (e.g. Exams)">
              <button type="submit" class="btn-primary">Write Record</button>
            </form>
          </section>

          <section class="form-group">
            <label>3. Map Weekly Schedule</label>
            <form id="add-schedule-form">
              <select id="sched-subject-id" class="subject-dropdown" required>
                <option value="">-- Await Subject --</option>
              </select>
              <div class="row">
                <select id="sched-day" required>
                 <option value="0">Mon</option>
                 <option value="1">Tue</option>
                 <option value="2">Wed</option>
                 <option value="3">Thu</option>
                 <option value="4">Fri</option>
                 <option value="5">Sat</option>
                 <option value="6">Sun</option>
                </select>
                <input type="number" id="sched-count" min="1" max="10" value="1" required title="Classes per day">
              </div>
              <button type="submit" class="btn-primary">Map Block</button>
            </form>
          </section>

          <section class="form-group">
            <label>4. Generate Semester Logs</label>
            <form id="generate-semester-form">
              <div class="date-row">
                <input type="date" id="start-date" required title="Start Date">
                <input type="date" id="end-date" required title="End Date">
              </div>
              <button type="submit" class="btn-primary">Compile Timeline</button>
            </form>
          </section>

          <section class="form-group">
            <label>5. Log Manual Override</label>
            <form id="add-extra-class-form">
              <select id="extra-subject-id" class="subject-dropdown" required>
                <option value="">-- Await Subject --</option>
              </select>
              <div class="row">
                <input type="date" id="extra-class-date" required title="Date">
                <select id="extra-class-status">
                  <option value="PENDING">Pending</option>
                  <option value="PRESENT">Present</option>
                  <option value="ABSENT">Absent</option>
                </select>
              </div>
              <button type="submit" class="btn-success">Force Insert</button>
            </form>
          </section>

          <section class="form-group danger-zone">
            <label>6. Critical Action</label>
            <button type="button" id="btn-reset-db" class="btn-danger">Drop Tables (Wipe Data)</button>
          </section>

        </div>
      </aside>

      <!-- Right Main Area: Data Visualization -->
      <div class="data-panel">
        
        <section class="content-section">
          <h2>Today's Execution Stack</h2>
          <div id="today-classes-list" class="data-grid">
            <p class="empty-state">No execution tasks for today.</p>
          </div>
        </section>

        <section class="content-section">
          <h2>System Health Overview</h2>
          <div id="subject-cards-list" class="data-grid">
            <p class="empty-state">Awaiting subject data...</p>
          </div>
        </section>

        <section class="content-section">
          <h2>Database History Query</h2>
          <div class="history-controls">
            <select id="history-subject-id" onchange="loadHistory()" class="history-select">
              <option value="">-- Target Subject --</option>
            </select>
          </div>
          <div id="history-list" class="history-logs">
            <p class="empty-state">Select subject to query logs.</p>
          </div>
        </section>

      </div>
    </main>
  </div>

  <script src="/frontend/script.js"></script>
</body>
</html>
